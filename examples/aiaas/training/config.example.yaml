model:
  name: Qwen/Qwen2.5-1.5B
  trust_remote_code: false
  use_fast_tokenizer: true

dataset:
  hf_name: wikimedia/wikipedia
  wikipedia_config: 20231101.de
  split: train
  streaming: true
  text_column: text
  min_chars: 500
  max_articles: 50000
  val_ratio: 0.01
  seed: 42
  
repos:
  root_dir: ~/ws
  output_dir: ./dataset
  mode: docs+comments
  max_chars: 4000
  overlap: 300
  min_chars: 200  

paths:
  dataset_dir: ./dataset
  output_dir: ./outputs/wiki-cpt
  cache_dir: null

training:
  block_size: 1024
  num_train_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  logging_steps: 10
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2
  dataloader_num_workers: 2
  bf16: true
  fp16: false
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  report_to: none
  do_eval: true
  max_eval_samples_blocks: 512

generation:
  max_new_tokens: 160
  temperature: 0.8
  top_p: 0.95
  do_sample: true

lora:
  enabled: false
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
