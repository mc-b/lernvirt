#cloud-config
apt:
  primary:
    - arches: [amd64, i386]
      uri: http://mirror.init7.net/ubuntu

  ports:
    - arches: [arm64, armhf]
      uri: http://ports.ubuntu.com/ubuntu-ports
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: 'insecure'       
    ssh_authorized_keys:
      - ssh-rsa  insecure@lerncloud
# login ssh and console with password
ssh_pwauth: true
disable_root: false 
packages:
  - jq
runcmd:
  - curl -sfL https://raw.githubusercontent.com/mc-b/lerncloud/main/services/nfsclient.sh | bash -
  - curl -sfL https://raw.githubusercontent.com/mc-b/lerncloud/main/services/vpn.sh | bash -
  - curl -fsSL https://ollama.com/install.sh | sh  
  - mkdir -p /etc/systemd/system/ollama.service.d
  - |
    cat <<EOF > /etc/systemd/system/ollama.service.d/override.conf
    [Service]
    Environment="OLLAMA_HOST=0.0.0.0:11434"
    EOF
  - systemctl daemon-reexec
  - systemctl daemon-reload
  - systemctl restart ollama
  - sudo -u ubuntu bash -lc "ollama pull llama3.1:8b-instruct-q4_K_M"
  - sudo -u ubuntu bash -lc "ollama pull qwen2.5:7b-instruct-q4_K_M"


