apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-shop-agent
  namespace: auto-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-shop-agent
  template:
    metadata:
      labels:
        app: auto-shop-agent
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "auto-shop-agent"
        dapr.io/app-port: "8000"
    spec:
      containers:
        - name: app
          image: YOUR_REGISTRY/auto-shop-agent:0.1.0
          ports:
            - containerPort: 8000
