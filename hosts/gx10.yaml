# VMs welche erstellt werden sollen. 
vm:
  count: 3

# WireGuard Clients. WireGuard erreichbar via Host
wgClients:
  count: 3
  endpointNode: 10.31.20.51
  
# Lokaler Image Cache vorhanden? 
mirror:
  enabled: true
  mirrorBaseUrl: http://10.31.20.51
  
# Cloud-init Datasource - fuer nfsclient.sh, mounted /data etc.  
datasource:
  serverIP: 10.31.20.51
    
# Bestimmung OS, Version und CPU Architektur  
os:
  architecture: arm64  # amd64 | arm64    

# StorageClass fuer DataVolume fuer Single Node, ARM64  
storage:
  enabled: true
  className: "hostpath-immediate"   # z.B. hostpath-immediate | microk8s-hostpath | ""
  
auth:
  # steuert das Erzeugen/Einspeisen des gemeinsamen SSH-Keys
  manageSshKey: false

  # steuert das Ersetzen von 'insecure' durch ein generiertes Passwort
  managePassword: false  