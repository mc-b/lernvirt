apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-content
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-content
  template:
    metadata:
      labels:
        app: web-content
    spec:
      containers:
        - name: httpd
          image: busybox:1.37
          command:
            - httpd
            - -f
            - -p
            - "8080"
            - -h
            - /www
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          hostPath:
            path: /var/www/html
            type: Directory