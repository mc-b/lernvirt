set default="1"

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod ntfs
insmod hfsplus
insmod xfs
insmod btrfs

set tftp_server="${net_default_server}"
if [ -z "${tftp_server}" ]; then
    set tftp_server="${pxe_default_server}"
fi

set root=(tftp,${tftp_server})
source (tftp,${tftp_server})/grub/runtime.cfg
source (tftp,${tftp_server})/grub/hosts.cfg

set timeout="${grub_timeout}"
set localroot=""
set lernvirt_installed="0"
# Lokale lernvirt-Installation erkennen, ohne GRUB-root vom TFTP-Server wegzusetzen.
if search --no-floppy --file --set=localroot /boot/lernvirt-installed; then
    set lernvirt_installed="1"
    set default="0"
elif search --no-floppy --file --set=localroot /lernvirt-installed; then
    # RHCOS hat eine separate boot-Partition. Dort liegt /boot/lernvirt-installed
    # aus Sicht von GRUB direkt als /lernvirt-installed.
    set lernvirt_installed="1"
    set default="0"
elif [ "${stack}" = "harvester" ]; then
    # Harvester/Elemental verwendet eine lokale Partition mit dem Label COS_STATE.
    # Die Erkennung gilt nur für den Harvester-Stack, damit ein späterer Wechsel
    # auf einen anderen Stack weiterhin eine Neuinstallation auslösen kann.
    if search --no-floppy --label --set=localroot COS_STATE; then
        set lernvirt_installed="1"
        set default="0"
    fi
fi
# Der Reset-Stack muss unabhängig vom lokalen Marker neu installieren.
if [ "${stack}" = "reset" ]; then
    set default="1"
fi

menuentry "Local boot (lernvirt)" {
    if [ -z "${localroot}" ]; then
        echo "Keine lokale lernvirt-Installation gefunden"
        sleep 2
        exit
    fi
    # Bei UEFI direkt den lokal installierten Bootloader starten. Das ist fuer
    # RHCOS robuster als die lokale grub.cfg mit dem PXE-GRUB zu interpretieren,
    # weil RHCOS BLS und die eigenen Red-Hat-GRUB-Module verwendet.
    insmod chain

    if search --no-floppy --file --set=efiroot /EFI/redhat/shimx64.efi; then
        set root="${efiroot}"
        chainloader /EFI/redhat/shimx64.efi
        boot
    fi
    if search --no-floppy --file --set=efiroot /EFI/redhat/grubx64.efi; then
        set root="${efiroot}"
        chainloader /EFI/redhat/grubx64.efi
        boot
    fi

    if search --no-floppy --file --set=efiroot /EFI/ubuntu/shimx64.efi; then
        set root="${efiroot}"
        chainloader /EFI/ubuntu/shimx64.efi
        boot
    fi

    # openSUSE / SUSE Linux Enterprise
    if search --no-floppy --file --set=efiroot /EFI/opensuse/shim.efi; then
        set root="${efiroot}"
        chainloader /EFI/opensuse/shim.efi
        boot
    fi
    if search --no-floppy --file --set=efiroot /EFI/opensuse/grubx64.efi; then
        set root="${efiroot}"
        chainloader /EFI/opensuse/grubx64.efi
        boot
    fi
    if search --no-floppy --file --set=efiroot /EFI/SuSE/grubx64.efi; then
        set root="${efiroot}"
        chainloader /EFI/SuSE/grubx64.efi
        boot
    fi

    if search --no-floppy --file --set=efiroot /EFI/BOOT/BOOTX64.EFI; then
        set root="${efiroot}"
        chainloader /EFI/BOOT/BOOTX64.EFI
        boot
    fi
    if search --no-floppy --file --set=efiroot /EFI/BOOT/BOOTAA64.EFI; then
        set root="${efiroot}"
        chainloader /EFI/BOOT/BOOTAA64.EFI
        boot
    fi
    # Fallback fuer BIOS bzw. Systeme ohne brauchbaren EFI-Loader.
    set root="${localroot}"
    if [ -f /grub2/grub.cfg ]; then
        set prefix="(${localroot})/grub2"
        configfile /grub2/grub.cfg
    fi
    if [ -f /grub/grub.cfg ]; then
        set prefix="(${localroot})/grub"
        configfile /grub/grub.cfg
    fi
    if [ -f /boot/grub/grub.cfg ]; then
        set prefix="(${localroot})/boot/grub"
        configfile /boot/grub/grub.cfg
    fi
    if [ -f /boot/grub2/grub.cfg ]; then
        set prefix="(${localroot})/boot/grub2"
        configfile /boot/grub2/grub.cfg
    fi
    echo "Lokaler Bootloader wurde nicht gefunden"
    sleep 3
    exit
}

source (tftp,${tftp_server})/grub/stacks/${stack}.cfg

if [ "${boot_tools}" = "1" ]; then
    source (tftp,${tftp_server})/grub/boot-tools.cfg
fi
