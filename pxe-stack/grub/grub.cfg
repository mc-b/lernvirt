set default="1"

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod ntfs
insmod hfsplus
insmod xfs
insmod btrfs

# Der Server kommt normalerweise aus DHCP/PXE.
set tftp_server="${net_default_server}"
if [ -z "${tftp_server}" ]; then
    set tftp_server="${pxe_default_server}"
fi
if [ -z "${tftp_server}" ]; then
    set tftp_server="192.168.1.101"
fi

# TFTP bleibt GRUB-root. Eine lokale Platte wird separat als localroot gesucht.
set root=(tftp,${tftp_server})

source (tftp,${tftp_server})/grub/runtime.cfg
source (tftp,${tftp_server})/grub/hosts.cfg

set timeout="${grub_timeout}"
set localroot=""
set lernvirt_installed="0"

# Kompatibel zur bisherigen pxe/-Logik. Wichtig: --set=localroot und nicht
# --set=root, damit TFTP während der restlichen GRUB-Konfiguration erhalten bleibt.
if search --no-floppy --file --set=localroot /boot/lernvirt-installed; then
    set lernvirt_installed="1"
    set default="0"
fi

# reset ist absichtlich nur ein normaler Stack. Er muss einen vorhandenen
# lernvirt-installed Marker ignorieren und die Reset-Installation starten.
if [ "${stack}" = "reset" ]; then
    set default="1"
fi

echo "lernvirt PXE"
echo "MAC:       ${net_default_mac}"
echo "Stack:     ${stack}"
echo "Variant:   ${variant}"
echo "Installed: ${lernvirt_installed}"

# Index 0: lokales System. Wenn kein Marker existiert, fällt exit auf den
# nächsten Firmware-Boot-Eintrag zurück.
menuentry "Boot installed system" {
    if [ -n "${localroot}" ]; then
        set root="${localroot}"
        if [ -f /boot/grub/grub.cfg ]; then
            configfile /boot/grub/grub.cfg
        fi
        if [ -f /boot/grub2/grub.cfg ]; then
            configfile /boot/grub2/grub.cfg
        fi
    fi
    exit
}

# Index 1 beginnt mit der Stack-Konfiguration. Neue Stacks benötigen weiterhin
# nur grub/stacks/<name>.cfg; es gibt keine feste OS-Verzweigung.
source (tftp,${tftp_server})/grub/stacks/${stack}.cfg

if [ "${boot_tools}" = "1" ]; then
    source (tftp,${tftp_server})/grub/boot-tools.cfg
fi
