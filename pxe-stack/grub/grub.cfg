set timeout=5
set default=1

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod ntfs
insmod hfsplus
insmod xfs
insmod btrfs

# Server aus PXE/DHCP übernehmen. Die vom Renderer gesetzte pxe_server-Variable
# wird erst nach dem Laden von runtime.cfg verfügbar.
set tftp_server="${net_default_server}"
if [ -z "${tftp_server}" ]; then
    set tftp_server="${pxe_default_server}"
fi

set root=(tftp,${tftp_server})
source (tftp,${tftp_server})/grub/runtime.cfg
source (tftp,${tftp_server})/grub/hosts.cfg

if [ -z "${tftp_server}" ]; then
    set tftp_server="${pxe_server}"
    set root=(tftp,${tftp_server})
fi

set timeout="${grub_timeout}"
set localroot=""
set win_esp=""
set mac_esp=""
set mac_sys=""
set lernvirt_installed="0"

# /boot/lernvirt-installed wie im bisherigen pxe/install-pxe.sh, aber ohne
# GRUB-root vom TFTP-Server wegzuschalten.
if search --no-floppy --file --set=localroot /boot/lernvirt-installed; then
    set lernvirt_installed="1"
    set default="0"
fi

# Bestehende Windows/macOS-Erkennung aus dem bisherigen PXE-Menü beibehalten.
search --no-floppy --file --set=win_esp /EFI/Microsoft/Boot/bootmgfw.efi
if [ -n "${win_esp}" ]; then
    set default="0"
fi

search --no-floppy --file --set=mac_esp /EFI/Apple/Boot/bootx64.efi
if [ -n "${mac_esp}" ]; then
    set default="0"
fi

search --no-floppy --file --set=mac_sys /System/Library/CoreServices/boot.efi
if [ -n "${mac_sys}" ]; then
    set default="0"
fi

# reset bleibt ein normaler Stack und ignoriert lokale Installationsmarker.
if [ "${stack}" = "reset" ]; then
    set default="1"
fi

echo "lernvirt PXE"
echo "MAC:       ${net_default_mac}"
echo "Server:    ${pxe_server}"
echo "Stack:     ${stack}"
echo "Variant:   ${variant}"
echo "Installed: ${lernvirt_installed}"

menuentry "Local boot (lernvirt)" {
    if [ -n "${localroot}" ]; then
        set root="${localroot}"
        if [ -f /boot/grub/grub.cfg ]; then
            configfile /boot/grub/grub.cfg
        fi
        if [ -f /boot/grub2/grub.cfg ]; then
            configfile /boot/grub2/grub.cfg
        fi
    fi

    # Bei Windows/macOS ohne lernvirt-Marker Netzwerkboot verlassen; die
    # Firmware kann dann mit dem lokalen Boot-Eintrag fortfahren.
    exit
}

# Stack dynamisch laden; keine feste OS-Liste.
source (tftp,${tftp_server})/grub/stacks/${stack}.cfg

if [ "${boot_tools}" = "1" ]; then
    source (tftp,${tftp_server})/grub/boot-tools.cfg
fi
