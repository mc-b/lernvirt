menuentry "Install Ubuntu ${ubuntu_version} - ${userdata}" {
    linux /linux/ubuntu/${ubuntu_codename}/amd64/vmlinuz \
        ip=dhcp \
        url=http://${pxe_server}:${http_port}/linux/ubuntu/${ubuntu_codename}/amd64/ubuntu-${ubuntu_version}-live-server-amd64.iso \
        autoinstall \
        cloud-config-url=http://${pxe_server}:${http_port}/autoinstall/${userdata} \
        ---
    initrd /linux/ubuntu/${ubuntu_codename}/amd64/initrd
}
