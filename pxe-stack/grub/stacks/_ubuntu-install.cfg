if [ "${grub_cpu}" = "x86_64" ]; then
    menuentry "Install Ubuntu ${ubuntu_version} - ${userdata} (amd64)" {
        linux /linux/ubuntu/${ubuntu_codename}/amd64/vmlinuz \
            ip=dhcp \
            url=http://${pxe_server}/linux/ubuntu/${ubuntu_codename}/amd64/ubuntu-${ubuntu_version}-live-server-amd64.iso \
            autoinstall debug \
            cloud-config-url=http://${pxe_server}/autoinstall/${userdata} \
            ---
        initrd /linux/ubuntu/${ubuntu_codename}/amd64/initrd
    }
fi

if [ "${grub_cpu}" = "arm64" -o "${grub_cpu}" = "aarch64" ]; then
    menuentry "Install Ubuntu ${ubuntu_version} - ${userdata} (arm64)" {
        linux /linux/ubuntu/${ubuntu_codename}/arm64/vmlinuz \
            ip=dhcp \
            url=http://${pxe_server}/linux/ubuntu/${ubuntu_codename}/arm64/ubuntu-${ubuntu_version}-live-server-arm64.iso \
            autoinstall debug \
            cloud-config-url=http://${pxe_server}/autoinstall/${userdata} \
            ---
        initrd /linux/ubuntu/${ubuntu_codename}/arm64/initrd
    }
fi
