# Alpine/BusyBox werden nur als optionale RAM-Bootvarianten angeboten.
# Der aktuelle Netboot-Download ist x86_64.
if [ "${grub_cpu}" = "x86_64" ]; then
    menuentry "Alpine Linux (RAM, keine Installation)" {
        set root=(tftp,${tftp_server})
        linux /linux/alpine/vmlinuz-lts \
            console=tty0 \
            nomodeset \
            ip=dhcp \
            modules=loop,squashfs,sd-mod,usb-storage \
            alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v${alpine_version}/main \
            modloop=http://${pxe_server}/linux/alpine/modloop-lts
        initrd /linux/alpine/initramfs-lts
    }

    # Alpine initramfs interpretiert "single" selbst und startet vor dem
    # eigentlichen RAM-System eine BusyBox/ash Shell. "exit" setzt den
    # normalen Alpine-Boot fort.
    menuentry "BusyBox Shell (Alpine initramfs, keine Installation)" {
        set root=(tftp,${tftp_server})
        linux /linux/alpine/vmlinuz-lts \
            console=tty0 \
            nomodeset \
            ip=dhcp \
            single \
            modules=loop,squashfs,sd-mod,usb-storage \
            alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v${alpine_version}/main \
            modloop=http://${pxe_server}/linux/alpine/modloop-lts
        initrd /linux/alpine/initramfs-lts
    }
fi
