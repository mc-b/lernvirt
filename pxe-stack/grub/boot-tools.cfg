menuentry "Alpine Linux (RAM, keine Installation)" {
    linux /linux/alpine/vmlinuz-lts \
        ip=dhcp \
        modules=loop,squashfs \
        alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v${alpine_version}/main \
        modloop=http://${pxe_server}:${http_port}/linux/alpine/modloop-lts \
        quiet
    initrd /linux/alpine/initramfs-lts
}

menuentry "BusyBox Shell (Alpine initramfs, keine Installation)" {
    linux /linux/alpine/vmlinuz-lts \
        ip=dhcp \
        single \
        alpine_repo=https://dl-cdn.alpinelinux.org/alpine/v${alpine_version}/main \
        modloop=http://${pxe_server}:${http_port}/linux/alpine/modloop-lts
    initrd /linux/alpine/initramfs-lts
}
