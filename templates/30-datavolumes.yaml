{{- range $i := until ($.Values.vm.count | int) }}
{{- $vm := fromYaml (include "vm.values" (dict "index" $i "values" $.Values)) }}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: {{ include "lernvirt.fullname" $ }}-vm-{{ $i }}
spec:
  source:
    http:
      url: {{ include "lernvirt.imageForVM" $ }}
  pvc:
    {{- if and $.Values.storage.enabled $.Values.storage.className }}
    storageClassName: {{ $.Values.storage.className }}
    {{- end }}
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ $vm.storage }}
---
{{- end }}
