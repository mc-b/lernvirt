{{- range $i := until (.Values.vm.count | int) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lernvirt.fullname" $ }}-vm-{{ $i }}
type: Opaque
data: {}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lernvirt.fullname" $ }}-ssh
type: Opaque
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lernvirt.fullname" $ }}-keygen-script
data:
  keygen.sh: |-
    #!/bin/sh
    set -e

    echo "[KEYGEN] starting"
    apk add --no-cache wireguard-tools kubectl jq curl coreutils openssh-keygen

    COUNT="{{ .Values.vm.count }}"
    DEFAULT_USERDATA="{{ .Values.vm.userdata }}"
    NS="${POD_NAMESPACE:-$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo default)}"
    FULLNAME="{{ include "lernvirt.fullname" $ }}"
    GW_PUB_SECRET="${FULLNAME}-gateway-pub"
    SSH_SECRET="${FULLNAME}-ssh"

    # -------- userdata array vorbereiten (per Helm gerendert) --------
    USERDATA_LIST=""
    i=0
    while [ "$i" -lt "$COUNT" ]; do
      case "$i" in
{{- range $k, $v := .Values }}
{{- if hasPrefix "vm-" $k }}
{{- if hasKey $v "userdata" }}
        {{ trimPrefix "vm-" $k }})
          USERDATA_LIST="$USERDATA_LIST {{ $v.userdata }}"
          ;;
{{- end }}
{{- end }}
{{- end }}
        *)
          USERDATA_LIST="$USERDATA_LIST __DEFAULT__"
          ;;
      esac
      i=$((i+1))
    done

    # shell positional params = userdata entries
    set -- $USERDATA_LIST

    echo "[KEYGEN] waiting for gateway public key"
    until kubectl get secret "$GW_PUB_SECRET" -n "$NS" >/dev/null 2>&1; do
      sleep 2
    done

    # IMPORTANT: Kubernetes stores secret .data.* as base64. Decode ONCE.
    GW_PUB=""
    until [ "${#GW_PUB}" -eq 44 ]; do
      GW_PUB_B64="$(kubectl get secret "$GW_PUB_SECRET" -n "$NS" \
        -o jsonpath='{.data.publickey}' 2>/dev/null || true)"

      if [ -n "$GW_PUB_B64" ]; then
        GW_PUB="$(printf "%s" "$GW_PUB_B64" | base64 -d || true)"
      fi

      sleep 2
    done

    echo "[KEYGEN] ensuring shared SSH key in secret $SSH_SECRET"
    SSH_PUB_LINE=""
    EXISTING_SSH_PUB_B64="$(kubectl get secret "$SSH_SECRET" -n "$NS" \
      -o jsonpath='{.data.ssh-publickey}' 2>/dev/null || true)"

    if [ -n "$EXISTING_SSH_PUB_B64" ]; then
      SSH_PUB_LINE="$(printf "%s" "$EXISTING_SSH_PUB_B64" | base64 -d || true)"
    fi

    if [ -z "$SSH_PUB_LINE" ]; then
      echo "[KEYGEN] generating new shared SSH key"
      umask 077
      ssh-keygen -q -t ed25519 -N "" -C "lernvirt@${FULLNAME}" -f /tmp/sshkey

      SSH_PRIV_B64="$(base64 -w0 /tmp/sshkey)"
      SSH_PUB_LINE="$(cat /tmp/sshkey.pub)"
      SSH_PUB_B64="$(printf "%s" "$SSH_PUB_LINE" | base64 -w0)"

      kubectl patch secret "$SSH_SECRET" -n "$NS" \
        --type merge \
        -p "{\"data\":{\"ssh-privatekey\":\"$SSH_PRIV_B64\",\"ssh-publickey\":\"$SSH_PUB_B64\"}}"
    else
      echo "[KEYGEN] reusing existing shared SSH key from secret $SSH_SECRET"
    fi

    i=0
    while [ "$i" -lt "$COUNT" ]; do
      eval "UD=\${$((i+1))}"

      if [ "$UD" = "__DEFAULT__" ]; then
        USERDATA_URL="$DEFAULT_USERDATA"
      else
        USERDATA_URL="$UD"
      fi

      VM_SECRET="${FULLNAME}-vm-$i"
      echo "[KEYGEN] processing $VM_SECRET (userdata=$USERDATA_URL)"

      # If secret already has a publickey, keep it (idempotent).
      EXISTING_PUB_B64="$(kubectl get secret "$VM_SECRET" -n "$NS" -o jsonpath='{.data.publickey}' 2>/dev/null || true)"

      if [ -n "$EXISTING_PUB_B64" ]; then
        echo "[KEYGEN] vm-$i already initialized -> updating userData only"
        PRIV=""
        PUB="$(printf "%s" "$EXISTING_PUB_B64" | base64 -d)"
      else
        umask 077
        PRIV="$(wg genkey)"
        PUB="$(printf "%s" "$PRIV" | wg pubkey)"
      fi

      HTTP_CODE="$(curl -sSL -w '%{http_code}' -o /tmp/userdata.yaml "$USERDATA_URL" || echo 000)"
      if [ "$HTTP_CODE" != "200" ]; then
        echo "[KEYGEN][WARN] cloud-init download failed (HTTP $HTTP_CODE)"
        rm -f /tmp/userdata.yaml
        i=$((i+1))
        continue
      fi

      # -------- Passwort aus 'insecure' ableiten und überall ersetzen --------
      PW=""
      if grep -q "plain_text_passwd: 'insecure'" /tmp/userdata.yaml; then
        EXISTING_PW_B64="$(kubectl get secret "$SSH_SECRET" -n "$NS" \
          -o jsonpath='{.data.password}' 2>/dev/null || true)"

        if [ -n "$EXISTING_PW_B64" ]; then
          PW="$(printf "%s" "$EXISTING_PW_B64" | base64 -d || true)"
        else
          echo "[KEYGEN] generating password for ubuntu user"
          PW="$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 16)"
          PW_B64="$(printf "%s" "$PW" | base64 -w0)"

          kubectl patch secret "$SSH_SECRET" -n "$NS" \
            --type merge \
            -p "{\"data\":{\"password\":\"$PW_B64\"}}"
        fi

        # alle Vorkommen von 'insecure' durch das generierte Passwort ersetzen:
        #  - plain_text_passwd: 'insecure'
        #  - echo insecure | tee ~/data/.ssh/passwd
        #  - echo "ubuntu:insecure" | chpasswd
        ESC_PW="$(printf '%s\n' "$PW" | sed 's/[&/\]/\\&/g')"
        sed -i "s/insecure/${ESC_PW}/g" /tmp/userdata.yaml
      fi

      # lerncloud SSH-Key in cloud-init ersetzen (ein Key für alle VMs)
      if [ -n "$SSH_PUB_LINE" ]; then
        if grep -q 'lerncloud' /tmp/userdata.yaml; then
          ESC_PUB_LINE="$(printf '%s\n' "$SSH_PUB_LINE" | sed 's/[&/\]/\\&/g')"
          sed -i "s#^      - .*lerncloud.*#      - ${ESC_PUB_LINE}#" /tmp/userdata.yaml
        fi
      fi

      IP="$((i+10))"

      # Append a write_files entry safely:
      # - If write_files exists already, append another "- path" item with 2-space indent.
      # - Otherwise create write_files and then the item.
      if grep -qE '^[[:space:]]*write_files:[[:space:]]*$' /tmp/userdata.yaml; then
        cat >> /tmp/userdata.yaml <<EOF

      - path: /etc/wireguard/${FULLNAME}-vm-$i.conf
        permissions: "0644"
        owner: root:root
        content: |
          [Interface]
          PrivateKey = ${PRIV:-__KEEP_EXISTING_PRIVATEKEY__}
          Address = 10.10.0.${IP}/32

          [Peer]
          PublicKey = ${GW_PUB}
          Endpoint = ${FULLNAME}-gateway:51820
          AllowedIPs = 10.10.0.0/24
          PersistentKeepalive = 25
          
      - path: /etc/datasource.conf
        permissions: "0644"
        owner: root:root
        content: |
           DataSourceLernVirt: DataSourceLernVirt [http://{{ .Values.datasource.serverIP }}/]         
    EOF
      else
        cat >> /tmp/userdata.yaml <<EOF

    write_files:
      - path: /etc/wireguard/${FULLNAME}-vm-$i.conf
        permissions: "0644"
        owner: root:root
        content: |
          [Interface]
          PrivateKey = ${PRIV:-__KEEP_EXISTING_PRIVATEKEY__}
          Address = 10.10.0.${IP}/32

          [Peer]
          PublicKey = ${GW_PUB}
          Endpoint = ${FULLNAME}-gateway:51820
          AllowedIPs = 10.10.0.0/24
          PersistentKeepalive = 25
      - path: /etc/datasource.conf
        permissions: "0644"
        owner: root:root
        content: |
           DataSourceLernVirt: DataSourceLernVirt [http://{{ .Values.datasource.serverIP }}/]        
    EOF
      fi

      USERDATA_B64="$(base64 -w0 /tmp/userdata.yaml)"
      PUB_B64="$(printf "%s" "$PUB" | base64 -w0)"

      kubectl patch secret "$VM_SECRET" -n "$NS" \
        --type merge \
        -p "{\"data\":{\"userData\":\"$USERDATA_B64\",\"publickey\":\"$PUB_B64\"}}"

      i=$((i+1))
    done

    echo "[KEYGEN] done"
    exit 0
