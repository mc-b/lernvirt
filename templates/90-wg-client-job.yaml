{{- $start := (.Values.wgClients.startHostId | int) }}
{{- $count := (.Values.wgClients.count | int) }}
{{- range $k := until $count }}
{{- $id := add $start $k }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lernvirt.fullname" $ }}-client-{{ $id }}
type: Opaque
data: {}
---
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lernvirt.fullname" $ }}-clients
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "90"    
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: {{ include "lernvirt.fullname" $ }}-gateway
      restartPolicy: Never
      containers:
      - name: wg
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e

          apk add --no-cache wireguard-tools kubectl coreutils

          FULLNAME="{{ include "lernvirt.fullname" $ }}"
          START={{ .Values.wgClients.startHostId }}
          COUNT={{ .Values.wgClients.count }}
          NS="{{ .Release.Namespace }}"
          WG_NET="10.10.0.0/24"
          ENDPOINT="{{ .Values.wgClients.endpointNode }}"

          # wait for gateway public key secret
          until kubectl get secret "${FULLNAME}-gateway-pub" -n "$NS" >/dev/null 2>&1; do
            sleep 2
          done

          # decode ONCE (k8s base64 only)
          GW_PUB="$(kubectl get secret "${FULLNAME}-gateway-pub" -n "$NS" \
            -o jsonpath='{.data.publickey}' | base64 -d)"

          [ -n "$GW_PUB" ] || exit 1

          # wait for service / nodePort
          until kubectl get svc "${FULLNAME}-gateway" -n "$NS" >/dev/null 2>&1; do
            sleep 2
          done

          WG_PORT="$(kubectl get svc "${FULLNAME}-gateway" -n "$NS" \
            -o jsonpath='{.spec.ports[?(@.port==51820)].nodePort}')"

          [ -n "$WG_PORT" ] || exit 1

          for i in $(seq 0 $((COUNT-1))); do
            HOST_ID=$((START+i))
            SECRET="${FULLNAME}-client-${HOST_ID}"
            CLIENT_IP="10.10.0.${HOST_ID}/32"

            # idempotent: keep existing key if present
            EXISTING_PUB_B64="$(kubectl get secret "$SECRET" -n "$NS" -o jsonpath='{.data.publickey}' 2>/dev/null || true)"

            if [ -n "$EXISTING_PUB_B64" ] && [ "${#EXISTING_PUB_B64}" -gt 10 ]; then
              CLIENT_PUB="$(printf "%s" "$EXISTING_PUB_B64" | base64 -d)"
              CLIENT_PRIV=""
            else
              umask 077
              CLIENT_PRIV="$(wg genkey)"
              CLIENT_PUB="$(printf "%s" "$CLIENT_PRIV" | wg pubkey)"
            fi

            cat > /tmp/wg0.conf <<EOF
          [Interface]
          PrivateKey = ${CLIENT_PRIV}
          Address = ${CLIENT_IP}

          [Peer]
          PublicKey = ${GW_PUB}
          Endpoint = ${ENDPOINT}:${WG_PORT}
          AllowedIPs = ${WG_NET}
          PersistentKeepalive = 25
          EOF

            CONF_B64="$(base64 -w0 /tmp/wg0.conf)"
            PUB_B64="$(printf "%s" "$CLIENT_PUB" | base64 -w0)"

            kubectl patch secret "$SECRET" -n "$NS" \
              --type merge \
              -p "{\"data\":{\"wg0.conf\":\"$CONF_B64\",\"publickey\":\"$PUB_B64\"}}"
          done
          echo "[CLIENTS] done"
          exit 0

