apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-user-mapping
  namespace: guacamole
data:
  user-mapping.xml: |
    <user-mapping>

        <authorize username="user1" password="insecure">
            <connection name="terra1">
                <protocol>rdp</protocol>
                <param name="hostname">10.10.1.11</param>
                <param name="port">3389</param>
                <param name="username">ubuntu</param>
                <param name="password">insecure</param>
                <param name="security">any</param>
                <param name="ignore-cert">true</param>
            </connection>
        </authorize>

        <authorize username="user2" password="insecure">
            <connection name="terra2">
